sources:
  - name: demo_src
    description: Данные из БД авиаперелетов
    tables:
    - name: aircrafts
      description: Модели самолетов
      columns: 
        - name: aircraft_code
          description: Код модели самолета
        - name: model
          description: Название модели самолета
        - name: range
          description: " Неизвестное поле "
    - name: airports
      description: Аэропорты
      columns:
        - name: airport_code
          description: Код аэропорта
        - name: airport_name
          description: Название аэропорта
        - name: city
          description: Город
        - name: coordinates
          description: Координаты
        - name: timezone
          description: Временная зона
    - name: seats
      description: Места в самолетах
      columns:
        - name: airport_code
          description: Код аэропорта
        - name: seat_no
          description: Номер места
        - name: fare_conditions
          description: Условия оплаты проезда
    - name: bookings
      columns:
        - name: book_ref
        - name: book_date
        - name: total_amount
      config:
        freshness:
              warn_after:
                count: 600000
                period: hour
              error_after:
                count: 10000
                period: day
              filter: current_timestamp::date - book_date::date < 30000
        loaded_at_field: book_date::timestamp
    - name: boarding_passes
      description: Посадочные талоны
      columns: 
        - name: ticket_no
          description: Номер билета
        - name: flight_id
          description: id рейса
        - name: boarding_no
          description: Номер посадки
        - name: seat_no
          description: Номер места
    - name: flights
      description: Полеты
      columns:
        - name: flight_id
        - name: flight_no
        - name: scheduled_departure
        - name: scheduled_arrival
        - name: departure_airport
        - name: arrival_airport
        - name: status
        - name: aircraft_code
        - name: actual_departure
        - name: actual_arrival
    - name: ticket_flights
      description: Билеты на рейсы
      columns:
        - name: ticket_no
        - name: flight_id
        - name: fare_conditions
        - name: amount
    - name: tickets
      description: Билеты
      columns:
        - name: ticket_no
        - name: book_ref
        - name: passenger_id
        - name: passenger_name
        - name: contact_data