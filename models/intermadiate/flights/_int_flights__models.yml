models:
  - name: fct_bookings
    description: Факты бронирования
    docs:
      show: true
      node_color: red
    config: 
      contract: {enforced: true}
      meta: 
        owner: 'yml_file_owner@gmail.com'
        status: in_dev
    
    columns:
      - name: book_ref
        data_type: varchar(8)
        constraints:
          - type: not_null
        tags: 
          - 'facts'
          - 'flights'
        tests: [not_null, unique]
      - name: book_date
        data_type: timestamptz
      - name: total_amount
        data_type: numeric(10, 2)
        constraints:
          - type: check
            expression: 'total_amount > 0'
        tests:
          - not_null
        meta:
          owner: finance_team
        quote: false
        